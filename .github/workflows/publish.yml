name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# We publish each member crate individually, in dependency order, rather than
# with a single workspace `cargo publish`. The coordinated workspace publish
# can deadlock in cargo's publish planner ("no packages ready to publish but N
# packages remain in plan", flagged as an internal cargo error) when the index
# hasn't propagated within its wait window — which left a 0.6.0 release half
# published. The per-crate loop avoids that planner, and because it skips any
# crate+version already on crates.io, a re-run cleanly resumes a partial
# publish. The job chain is: verify → publish-crate → release.

jobs:
  # Sanity: the workspace must compile & test from a fresh checkout of the
  # tagged commit before we advertise a release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Verify tag matches workspace version
        run: |
          # Select the bergshamra package by name rather than parsing
          # workspace_members[0], whose string format and ordering are not
          # guaranteed stable across Cargo versions. All workspace crates share
          # the workspace version, so the bergshamra crate's version is the
          # release version.
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "bergshamra") | .version')
          if [ -z "${version}" ]; then
            echo "Could not determine bergshamra version from cargo metadata" >&2
            exit 1
          fi
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match bergshamra version v${version}" >&2
            exit 1
          fi

      - name: Build workspace
        run: cargo build --locked --workspace --no-default-features --features rustcrypto,legacy-algorithms,post-quantum,pkcs11

      - name: Test workspace
        run: cargo test --locked --workspace --no-default-features --features rustcrypto,legacy-algorithms,post-quantum,pkcs11 --lib

  # Publish to crates.io via OIDC trusted publishing. No long-lived
  # CARGO_REGISTRY_TOKEN secret is needed — `crates-io-auth-action`
  # exchanges the GitHub OIDC token for a short-lived crates.io token
  # gated by the trusted-publishing config on https://crates.io/me.
  publish-crate:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      # Skip the tag-vs-Cargo.toml verification for manual dispatch
      # (no tag context). On a real tag push, refuse to publish if the
      # tag and Cargo.toml version don't match.
      - name: Verify tag matches crate version
        if: github.event_name == 'push'
        run: |
          version=$(grep -m 1 '^version' Cargo.toml | sed -E 's/version *= *"(.+)"/\1/')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"
            exit 1
          fi

      # Verification always; real `publish` only on tag push so manual
      # workflow runs can sanity-check the workflow without uploading.
      #
      # A per-crate `cargo publish --dry-run` loop cannot work here: a dry run
      # never uploads, so every crate after bergshamra-core fails to resolve
      # the not-yet-published new version of its workspace siblings from the
      # crates.io index. Workspace-aware `cargo package` (Cargo >= 1.90)
      # verifies every member against a temporary local registry overlay
      # containing the freshly packaged siblings instead.
      - name: Verify publishable packages
        run: cargo package --workspace --locked

      - name: Publish to crates.io
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version=$(grep -m 1 '^version' Cargo.toml | sed -E 's/version *= *"(.+)"/\1/')

          # Member crates in dependency (topological) order. `cargo publish -p`
          # waits for each crate to land in the index before returning, so the
          # next crate's dependency is available when it builds.
          crates=(
            bergshamra-core
            bergshamra-xml
            bergshamra-crypto
            bergshamra-pkcs12
            bergshamra-c14n
            bergshamra-keys
            bergshamra-transforms
            bergshamra-dsig
            bergshamra-enc
            bergshamra
          )

          for crate in "${crates[@]}"; do
            # Sparse-index path: names >= 4 chars use the xx/yy/<name> layout.
            index_url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
            if curl -sf "$index_url" | grep -q "\"vers\":\"${version}\""; then
              echo "== ${crate} ${version} already on crates.io, skipping"
              continue
            fi
            echo "== Publishing ${crate} ${version}"
            cargo publish --locked -p "${crate}"
          done

  # GitHub Release with auto-generated notes — only after a successful
  # crates.io publish, and only on a real tag push.
  release:
    needs: publish-crate
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
