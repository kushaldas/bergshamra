# cargo-audit allow-list.
#
# Each entry documents *why* the advisory is ignored, what the upstream
# fix looks like, and who has to move for bergshamra to drop the entry.
# We retain two ignores because rsa 0.9 and rand 0.8 (via the older num-bigint-dig
# used by RSA/DSA) remain in the dependency tree. See docs/ecosystem.md
# for the constraints on migrating those dependencies.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" timing sidechannel.
    # Severity 5.9 (medium). No fixed upgrade is available in the 0.9.x
    # line. Stable rsa 0.10 is released, but Kryptering 0.7.0's exact
    # =0.10.0-rc.19 pin blocks resolving it alongside the backend.
    # Bergshamra's threat model for XML-DSig / XML-Enc users
    # who need timing-side-channel resistance should route RSA private
    # operations through an HSM via kryptering::pkcs11 rather than
    # relying on the software path.
    # Upstream: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0097 — rand 0.8.5 "unsound with a custom logger using
    # rand::rng()". Pulled in transitively via num-bigint-dig (which rsa
    # 0.9 and dsa 0.6 use) and also directly. The unsound pattern
    # requires a caller to install a custom `log::Log` implementation
    # that itself calls `rand::rng()`; bergshamra installs no logger
    # and does not reach for `rand::rng()` in any such context. The fix
    # is in rand 0.9, but num-bigint-dig pins rand 0.8, so even bumping
    # our direct dep would not remove the transitive 0.8 pull. Our direct
    # num-bigint-dig is now 0.9; RSA/DSA still pull the older 0.8 line.
    # Revisit when the remaining RSA/DSA import stack can move together.
    "RUSTSEC-2026-0097",

    # Note — ml-dsa advisory posture:
    # RUSTSEC-2025-0144 (timing side-channel in ML-DSA decomposition, fixed
    # by replacing hardware division with constant-time Barrett reduction)
    # is patched in ml-dsa >= 0.1.0-rc.3. Bergshamra depends on ml-dsa 0.1.2
    # in the workspace Cargo.toml, so this advisory does not fire against
    # our Cargo.lock and needs no ignore entry. Revisit only if ml-dsa
    # is pinned backward.
    # Upstream: https://github.com/RustCrypto/signatures/security/advisories/GHSA-hcp2-x6j4-29j7
]
